:root{--sky:#38bdf8;--navy:#082f49;--accent:#0369a1;--tint:#f0f9ff;--ink:#1f2937;--muted:#5b6b7a;--line:#cfe6f5}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"MVWaheed","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.9;-webkit-font-smoothing:antialiased}
html[lang=en] body{line-height:1.6}
h1,h2,h3,.ttl{font-family:"Aammufk","MVWaheed","Segoe UI",system-ui,sans-serif;font-weight:700;line-height:1.7}
html[lang=en] h1,html[lang=en] h2,html[lang=en] h3,html[lang=en] .ttl{line-height:1.25}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ff8a80;outline-offset:2px}
.wrap{width:min(1080px,100% - 2rem);margin-inline:auto}

/* Ad */
.ad{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;background:repeating-linear-gradient(45deg,#f3ebe9,#f3ebe9 10px,#f9f3f1 10px,#f9f3f1 20px);border:1px dashed #d8c7c3;border-radius:6px}
.ad-top{height:90px;max-width:650px;margin:.4rem auto}

/* Top banner ad (sample) */
.banner{position:relative;display:flex;align-items:center;gap:1rem;max-width:728px;min-height:90px;margin:.4rem auto;padding:.6rem 1.3rem;border-radius:8px;overflow:hidden;color:#fff;background:radial-gradient(circle at 92% 15%,rgba(255,255,255,.28),transparent 38%),radial-gradient(circle at 70% 120%,rgba(56,189,248,.6),transparent 45%),linear-gradient(110deg,#082f49,#0369a1 60%,#38bdf8)}
.adtag{position:absolute;top:0;inset-inline-end:.8rem;background:rgba(255,255,255,.92);color:#555;font-size:.7rem;line-height:1.5;padding:0 .6rem;border-radius:0 0 6px 6px}
.b-ico{font-size:2.2rem;line-height:1}
.b-txt{flex:1;display:flex;flex-direction:column;line-height:1.5}
.b-txt b{font-size:1.45rem}
.b-txt small{font-size:.92rem;opacity:.92}
.b-cta{background:#fff;color:var(--accent);border-radius:999px;padding:.2rem 1.3rem;white-space:nowrap;font-family:"Aammufk","MVWaheed",sans-serif}
.banner:hover .b-cta{background:var(--navy);color:#fff}

/* Header */
.top{background:var(--tint);padding:.8rem 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.top .logo img{display:block;height:34px;width:auto}
.meta,.tools{display:flex;align-items:center;gap:.9rem;font-size:.9rem;color:var(--muted);flex:1}
.tools{justify-content:flex-end}
.meta{justify-content:flex-start}
.tools a{font-size:.85rem}
.lang{border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;padding:.1rem .9rem;font-size:.9rem}
.lang:hover{background:var(--accent);color:#fff}
.search{display:flex;align-items:center;border-bottom:1px solid var(--accent);gap:.3rem}
.search input{border:0;background:none;font:inherit;width:90px;padding:.1rem .2rem;color:var(--ink)}
.search input:focus{outline:none}

/* Nav */
nav{background:var(--sky);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}
nav ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;padding:.15rem 0}
.burger{display:none;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:var(--navy);padding:.5rem .3rem;font-family:"Aammufk","MVWaheed",sans-serif;font-size:1.1rem}
.burger i{font-style:normal;font-size:1.5rem;line-height:1}
nav a{display:block;color:var(--navy);padding:.25rem 1.1rem;white-space:nowrap;font-size:1.05rem;font-family:"Aammufk","MVWaheed",sans-serif;border-radius:6px}
nav a:hover,nav a.on{background:rgba(8,47,73,.16)}
.sec-title.cat-h{margin-top:.3rem}

/* Hero */
.hero{background:linear-gradient(180deg,#e0f2fe,#bae6fd);color:var(--navy);padding:2.5rem 0 3rem;text-align:center}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin-bottom:1.5rem}
.hero h1 b{color:var(--accent)}
.rail{position:relative}
.cards{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:.5rem .2rem 1rem}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 min(300px,82%);scroll-snap-align:center;background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;text-align:start;position:relative;transition:transform .2s;box-shadow:0 8px 24px rgba(3,105,161,.18)}
.card:hover{transform:translateY(-4px)}
.card .img{height:190px}
.card .body{padding:1.1rem 1.1rem 1rem}
.card h3{font-size:1.25rem}
.pill{position:absolute;top:.8rem;inset-inline-start:50%;transform:translateX(-50%);background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 .9rem;font-size:.85rem;line-height:1.7;z-index:1}
.date{color:var(--muted);font-size:.85rem;margin-top:.4rem}
.arrow{position:absolute;top:45%;background:rgba(8,47,73,.14);color:var(--navy);border:0;width:38px;height:38px;border-radius:50%;font-size:1.3rem;line-height:1}
.arrow:hover{background:rgba(8,47,73,.26)}
.arrow.prev{inset-inline-start:-6px}.arrow.next{inset-inline-end:-6px}
.more{display:inline-block;margin-top:.8rem;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:.2rem 1.4rem}
.more:hover{background:var(--accent);color:#fff}

/* Main grid */
main{padding:2.5rem 0}
.grid{display:grid;gap:1.8rem;grid-template-columns:1fr 1.7fr 1fr}
.col{display:flex;flex-direction:column;gap:1.4rem}
.item{padding-bottom:1.2rem;border-bottom:1px solid var(--line)}
.item:last-of-type{border:0}
.tag{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 .8rem;font-size:.8rem;line-height:1.6}
.item h3{font-size:1.1rem;margin-top:.3rem}
.thumb{height:130px;border-radius:6px;margin-bottom:.6rem}
.feature .img{height:340px;border-radius:6px}
.feature h2{font-size:1.9rem;color:var(--accent);text-align:center;margin-top:.6rem}
.feature .date{text-align:center}
.ad-box{height:240px}
.sec-title{font-size:1.5rem;color:var(--navy);border-bottom:2px solid var(--sky);margin:2.5rem 0 1.2rem;padding-bottom:.2rem}

/* Article page */
#page{padding:2rem 0 1rem}
.art{max-width:740px;margin:0 auto}
.back{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:.1rem 1.1rem;margin-bottom:1.2rem}
.back:hover{background:var(--accent);color:#fff}
.art h1{font-size:clamp(1.7rem,5vw,2.6rem);color:var(--navy);margin:.5rem 0}
.meta2{color:var(--muted);font-size:.95rem;margin-bottom:1.2rem}
.artimg{height:clamp(220px,45vw,400px);border-radius:14px;margin-bottom:1.6rem}
.prose p{font-size:clamp(1.12rem,2.3vw,1.28rem);line-height:2.2;margin-bottom:1.3rem;color:#1f2937}
html[lang=en] .prose p{line-height:1.85}
.prose p:first-child{font-family:"Aammufk","MVWaheed","Segoe UI",sans-serif;font-size:clamp(1.25rem,2.7vw,1.45rem);color:var(--navy)}
.pn{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);margin-top:1.5rem;padding-top:1rem}
.pn a{color:var(--accent);max-width:48%;font-size:.95rem}
.pn a:hover{text-decoration:underline}
.rel{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* Footer */
footer{background:var(--sky);color:var(--navy);padding:2.5rem 0 1rem;margin-top:2rem}
.fgrid{display:grid;gap:2rem;grid-template-columns:1.3fr 1fr 1fr 1fr}
footer h4{font-family:"Aammufk","MVWaheed",sans-serif;font-size:1.15rem;border-bottom:1px solid rgba(8,47,73,.4);padding-bottom:.3rem;margin-bottom:.7rem}
footer ul{list-style:none}
footer li a:hover{text-decoration:underline}
.flogo{display:inline-block;background:#fff;border-radius:12px;padding:.4rem .8rem;margin-bottom:.8rem}
.flogo img{display:block;height:26px}
.social{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.social a{background:var(--navy);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:system-ui,sans-serif}
.copy{text-align:center;border-top:1px solid rgba(8,47,73,.35);margin-top:1.8rem;padding-top:.8rem;font-size:.85rem}

@media(max-width:860px){
  .burger{display:flex}
  nav ul{display:none;flex-direction:column;flex-wrap:nowrap;gap:0;width:100%;padding:0 0 .5rem}
  nav ul.open{display:flex}
  nav li a{padding:.55rem .4rem;border-top:1px solid rgba(8,47,73,.2);border-radius:0}
  .grid{grid-template-columns:1fr}
  .feature{order:-1}
  .fgrid{grid-template-columns:1fr 1fr}
  .meta .w{display:none}
  .search input{width:60px}
}
@media(max-width:520px){
  .b-ico{display:none}.b-txt b{font-size:1.15rem}.b-txt small{font-size:.8rem}.b-cta{padding:.1rem .9rem;font-size:.9rem}
  .top .wrap{flex-wrap:wrap;justify-content:center}
  .top .logo{order:-1;flex-basis:100%;display:block}
  .top .logo img{margin-inline:auto}
  .meta,.tools{justify-content:center}
  .arrow{display:none}
  .feature .img{height:230px}.feature h2{font-size:1.5rem}
  .fgrid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>

function render(){
  var h = document.documentElement;
  h.lang = lang; h.dir = lang==="dv" ? "rtl" : "ltr";
  document.title = lang==="dv" ? "ޚަބަރު | News" : "News | ޚަބަރު";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent = UI[lang][e.dataset.i]});
  $("q").placeholder = UI[lang].search;
  $("lang").textContent = UI[lang].toggle;
  $("copy").textContent = UI[lang].copy;
  var d = new Date();
  $("date").textContent = d.getDate()+" "+MONTHS[lang][d.getMonth()]+" "+d.getFullYear();
  var keys = Object.keys(CATS);
  var lk=function(k){return '<li><a data-k="'+k+'" href="'+(k==="home"?'#':'#c/'+k)+'">'+CATS[k][lang]+'</a></li>'};

var lastY = 0, inSub = false;
function parse(){
  var h=location.hash, m=/^#a\/(\d+)$/.exec(h);
  if(m && A[+m[1]]) return {t:"a",k:+m[1]};
  m=/^#c\/(\w+)$/.exec(h);
  if(m && m[1]!=="home" && CATS[m[1]]) return {t:"c",k:m[1]};
  return {t:"h"};
}
function articleHtml(k){
  var a=A[k], n=A.length, u=UI[lang], paras=(a.body||SAMPLE)[lang];
  var d=new Date(Date.now()-a.t*3600000);
  var rel=[1,2,3].map(function(j){var x=(k+j)%n;return item(A[x],x,true)}).join("");
  return '<article class="art"><a class="back" href="#">'+u.back+'</a><br><a class="tag" href="#c/'+a.c+'">'+CATS[a.c][lang]+'</a><h1>'+a.h[lang]+'</h1>'
   +'<div class="meta2">'+d.getDate()+' '+MONTHS[lang][d.getMonth()]+' '+d.getFullYear()+' · '+ago(a)+'</div>'
   +img(k,'artimg')+'<div class="prose">'+paras.map(function(t){return '<p>'+t+'</p>'}).join("")+'</div>'
   +'<div class="pn"><a href="#a/'+((k-1+n)%n)+'">'+u.prev+'</a><a href="#a/'+((k+1)%n)+'">'+u.next+'</a></div></article>'
   +'<h2 class="sec-title">'+u.related+'</h2><div class="grid rel">'+rel+'</div>';
}
function catHtml(key){
  var list=A.map(function(a,i){return a.c===key?item(a,i,true):""}).join("");
  return '<a class="back" href="#">'+UI[lang].back+'</a><h2 class="sec-title cat-h">'+CATS[key][lang]+'</h2><div class="grid rel">'+list+'</div>';
}
function show(){
  var r=parse();
  $("home").hidden = r.t!=="h"; $("page").hidden = r.t==="h";
  if(r.t==="a"){ $("page").innerHTML=articleHtml(r.k); document.title=A[r.k].h[lang]; }
  if(r.t==="c"){ $("page").innerHTML=catHtml(r.k); document.title=CATS[r.k][lang]; }
  document.querySelectorAll("#nav a").forEach(function(l){l.classList.toggle("on", r.t==="c" && l.dataset.k===r.k)});
}
function route(){
  var r=parse();
  if(r.t!=="h" && !inSub) lastY = window.pageYOffset;
  show();
  if(r.t!=="h") window.scrollTo(0,0);
  else if(location.hash==="#all") $("all").scrollIntoView();
  else if(inSub) window.scrollTo(0,lastY);
  inSub = r.t!=="h";
}
window.addEventListener("hashchange",route);
function closeMenu(){$("nav").classList.remove("open");$("burger").setAttribute("aria-expanded","false")}
$("burger").onclick = function(){var o=$("nav").classList.toggle("open");this.setAttribute("aria-expanded",o)};
$("nav").onclick = function(e){var l=e.target.closest("a");if(l){if(l.getAttribute("href")==="#")lastY=0;closeMenu()}};
document.querySelector(".logo").onclick = function(){lastY=0};
window.addEventListener("resize",function(){if(innerWidth>860)closeMenu()});
document.addEventListener("click",function(e){if(!e.target.closest("nav"))closeMenu()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenu()});
$("lang").onclick = function(){lang = lang==="dv" ? "en" : "dv"; closeMenu(); render()};
function slide(dir){
  var c = $("hero"), rtl = document.dir==="rtl" || document.documentElement.dir==="rtl";
  c.scrollBy({left:(rtl?-dir:dir)*320,behavior:"smooth"});
}
$("next").onclick = function(){slide(1)};
$("prev").onclick = function(){slide(-1)};
render(); route();
