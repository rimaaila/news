:root{--red:#c4261e;--red-dark:#8f1913;--maroon:#2a1517;--blush:#fff4f2;--ink:#2b2b2b;--muted:#7a6f6e;--line:#e6d9d6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"MVWaheed","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.9;-webkit-font-smoothing:antialiased}
html[lang=en] body{line-height:1.6}
h1,h2,h3,.ttl{font-family:"Aammufk","MVWaheed","Segoe UI",system-ui,sans-serif;font-weight:700;line-height:1.7}
html[lang=en] h1,html[lang=en] h2,html[lang=en] h3,html[lang=en] .ttl{line-height:1.25}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ff8a80;outline-offset:2px}
.wrap{width:min(1080px,100% - 2rem);margin-inline:auto}

/* Ad */
.ad{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;background:repeating-linear-gradient(45deg,#f3ebe9,#f3ebe9 10px,#f9f3f1 10px,#f9f3f1 20px);border:1px dashed #d8c7c3;border-radius:6px}
.ad-top{height:90px;max-width:650px;margin:.4rem auto}

/* Header */
.top{background:var(--blush);padding:.8rem 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.top .logo img{display:block;height:34px;width:auto}
.meta,.tools{display:flex;align-items:center;gap:.9rem;font-size:.9rem;color:var(--muted);flex:1}
.tools{justify-content:flex-end}
.meta{justify-content:flex-start}
.tools a{font-size:.85rem}
.lang{border:1px solid var(--red);color:var(--red);background:#fff;border-radius:999px;padding:.1rem .9rem;font-size:.9rem}
.lang:hover{background:var(--red);color:#fff}
.search{display:flex;align-items:center;border-bottom:1px solid var(--red);gap:.3rem}
.search input{border:0;background:none;font:inherit;width:90px;padding:.1rem .2rem;color:var(--ink)}
.search input:focus{outline:none}

/* Nav */
nav{background:var(--red);position:sticky;top:0;z-index:5}
nav ul{list-style:none;display:flex;justify-content:center;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding:.15rem 0}
nav a{display:block;color:#fff;padding:.25rem 1.1rem;white-space:nowrap;font-size:1.05rem;font-family:"Aammufk","MVWaheed",sans-serif;border-radius:6px}
nav a:hover{background:rgba(255,255,255,.18)}

/* Hero */
.hero{background:var(--maroon);color:#fff;padding:2.5rem 0 3rem;text-align:center}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin-bottom:1.5rem}
.hero h1 b{color:#e8483f}
.rail{position:relative}
.cards{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:.5rem .2rem 1rem}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 min(300px,82%);scroll-snap-align:center;background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;text-align:start;position:relative;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card .img{height:190px}
.card .body{padding:1.1rem 1.1rem 1rem}
.card h3{font-size:1.25rem}
.pill{position:absolute;top:.8rem;inset-inline-start:50%;transform:translateX(-50%);background:#fff;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:0 .9rem;font-size:.85rem;line-height:1.7;z-index:1}
.date{color:var(--muted);font-size:.85rem;margin-top:.4rem}
.arrow{position:absolute;top:45%;background:rgba(255,255,255,.15);color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:1.3rem;line-height:1}
.arrow:hover{background:rgba(255,255,255,.3)}
.arrow.prev{inset-inline-start:-6px}.arrow.next{inset-inline-end:-6px}
.more{display:inline-block;margin-top:.8rem;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:.2rem 1.4rem}
.more:hover{background:#fff;color:var(--maroon)}

/* Placeholder images (replace with real photos) */
.g0{background:linear-gradient(135deg,#c4261e,#5b0f0b)}
.g1{background:linear-gradient(135deg,#0f766e,#134e4a)}
.g2{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.g3{background:linear-gradient(135deg,#b45309,#78350f)}
.g4{background:linear-gradient(135deg,#6d28d9,#312e81)}
.g5{background:linear-gradient(135deg,#be123c,#4c0519)}
.img{background-size:cover}

/* Main grid */
main{padding:2.5rem 0}
.grid{display:grid;gap:1.8rem;grid-template-columns:1fr 1.7fr 1fr}
.col{display:flex;flex-direction:column;gap:1.4rem}
.item{padding-bottom:1.2rem;border-bottom:1px solid var(--ink)}
.item:last-of-type{border:0}
.item .tag{display:inline-block;border:1px solid #7c3aed;color:#7c3aed;border-radius:999px;padding:0 .8rem;font-size:.8rem;line-height:1.6}
.item h3{font-size:1.1rem;margin-top:.3rem}
.thumb{height:130px;border-radius:6px;margin-bottom:.6rem}
.feature .img{height:340px;border-radius:6px}
.feature h2{font-size:1.9rem;color:var(--red);text-align:center;margin-top:.6rem}
.feature .date{text-align:center}
.ad-box{height:240px}
.sec-title{font-size:1.5rem;color:var(--red-dark);border-bottom:2px solid var(--red);margin:2.5rem 0 1.2rem;padding-bottom:.2rem}

/* Footer */
footer{background:var(--red);color:#fff;padding:2.5rem 0 1rem;margin-top:2rem}
.fgrid{display:grid;gap:2rem;grid-template-columns:1.3fr 1fr 1fr 1fr}
footer h4{font-family:"Aammufk","MVWaheed",sans-serif;font-size:1.15rem;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:.3rem;margin-bottom:.7rem}
footer ul{list-style:none}
footer li a:hover{text-decoration:underline}
.flogo{display:inline-block;background:#fff;border-radius:12px;padding:.4rem .8rem;margin-bottom:.8rem}
.flogo img{display:block;height:26px}
.social{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.social a{background:#fff;color:var(--red);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:system-ui,sans-serif}
.copy{text-align:center;border-top:1px solid rgba(255,255,255,.5);margin-top:1.8rem;padding-top:.8rem;font-size:.85rem}

@media(max-width:860px){
  .grid{grid-template-columns:1fr}
  .feature{order:-1}
  .fgrid{grid-template-columns:1fr 1fr}
  .meta .w{display:none}
  .search input{width:60px}
}
@media(max-width:520px){
  .top .wrap{flex-wrap:wrap;justify-content:center}
  .top .logo{order:-1;flex-basis:100%;text-align:center}
  .meta,.tools{justify-content:center}
  .arrow{display:none}
  .feature .img{height:230px}.feature h2{font-size:1.5rem}
  .fgrid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>

var $ = function(id){return document.getElementById(id)};
function img(i){return '<div class="img g'+(i%6)+'"></div>'}
function ago(a){return UI[lang].ago(a.t)}
function card(a,i){return '<a class="card" href="#"><span class="pill">'+CATS[a.c][lang]+'</span>'+img(i)+'<div class="body"><h3>'+a.h[lang]+'</h3><div class="date">'+ago(a)+'</div></div></a>'}
function item(a,i,thumb){return '<a class="item" href="#">'+(thumb?'<div class="thumb img g'+(i%6)+'"></div>':'')+'<span class="tag">'+CATS[a.c][lang]+'</span><h3>'+a.h[lang]+'</h3><div class="date">'+ago(a)+'</div></a>'}
function render(){
  var h = document.documentElement;
  h.lang = lang; h.dir = lang==="dv" ? "rtl" : "ltr";
  document.title = lang==="dv" ? "ޚަބަރު | News" : "News | ޚަބަރު";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent = UI[lang][e.dataset.i]});
  $("q").placeholder = UI[lang].search;
  $("lang").textContent = UI[lang].toggle;
  $("copy").textContent = UI[lang].copy;
  var d = new Date();
  $("date").textContent = d.getDate()+" "+MONTHS[lang][d.getMonth()]+" "+d.getFullYear();
  var keys = Object.keys(CATS);
  $("nav").innerHTML = keys.map(function(k){return '<li><a href="#">'+CATS[k][lang]+'</a></li>'}).join("");
  $("flinks").innerHTML = keys.map(function(k){return '<li><a href="#">'+CATS[k][lang]+'</a></li>'}).join("");
  $("hero").innerHTML = A.slice(0,4).map(function(a,i){return card(a,i)}).join("");
  $("colA").innerHTML = item(A[4],4)+item(A[5],5)+'<div class="ad ad-box">'+UI[lang].ad+'</div>';
  $("colB").innerHTML = '<a href="#"><div class="img g0"></div><div class="date" style="margin-top:.6rem">'+ago(A[6])+'</div><h2>'+A[6].h[lang]+'</h2></a>';
  $("colC").innerHTML = item(A[7],1,true)+item(A[8],2,true);
  $("more").innerHTML = A.slice(9).map(function(a,i){return item(a,i+3,true)}).join("");
}
$("lang").onclick = function(){lang = lang==="dv" ? "en" : "dv"; render()};
function slide(dir){
  var c = $("hero"), rtl = document.dir==="rtl" || document.documentElement.dir==="rtl";
  c.scrollBy({left:(rtl?-dir:dir)*320,behavior:"smooth"});
}
$("next").onclick = function(){slide(1)};
$("prev").onclick = function(){slide(-1)};
render();
</script>
